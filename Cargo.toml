[package]
name = "comment-translate"
version = "0.1.1"
edition = "2021"
publish = false
# examples/ містить налаштування Zed і демо-файли, а не приклади Cargo.
autoexamples = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["server"]
resolver = "2"

[dependencies]
zed_extension_api = "0.7"
serde_json = "1"
