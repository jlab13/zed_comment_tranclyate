[package]
name = "comment-translate-lsp"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["apple"]
apple = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"
tower = "0.4"
tree-sitter = "0.25"
tree-sitter-c = "0.24"

[build-dependencies]
serde_json = "1"
