id = "comment-translate"
name = "Comment Translation"
version = "0.1.0"
schema_version = 1
authors = ["Comment Translate contributors"]
description = "Translate code comments into your language in the hover popup."

[language_servers.comment-translate]
name = "Comment Translate"
# Swift і Dart надають розширення Zed «Swift» і «Dart»; без них ці мови просто не з’являються.
languages = ["C", "C++", "Rust", "Python", "Shell Script", "Swift", "Dart"]

# Стабільні languageId замість назв мов у нижньому регістрі («c++», «shell script»).
[language_servers.comment-translate.language_ids]
"C" = "c"
"C++" = "cpp"
"Rust" = "rust"
"Python" = "python"
"Shell Script" = "shellscript"
"Swift" = "swift"
"Dart" = "dart"
